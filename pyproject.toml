[project]
name = "amplifier-unified-media"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
openai = ["aiohttp>=3.12,<4"]
test = ["aiohttp>=3.12,<4", "pytest>=8", "pytest-asyncio>=0.24"]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["python/amplifier_unified_media"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
